
name: pytorch_env

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy
      - pandas
      - matplotlib
      - pillow
      - scikit-learn
      - opencv-python
      - tqdm
      - jupyter
      - ipykernel
      - albumentations
      - torch
      - torchvision
